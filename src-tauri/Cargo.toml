[package]
name = "vedara"
version = "1.0.0"
description = "Vedara: 100% Offline, Native Local AI IDE & Agentic Workspace"
authors = ["Shourya Solanki and Vedara Contributors"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "vedara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
sysinfo = "0.30"
walkdir = "2.5"
ignore = "0.4"
notify = "6.1"
notify-debouncer-mini = "0.4"
portable-pty = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
lsp-types = "0.95"
dunce = "1.0"
